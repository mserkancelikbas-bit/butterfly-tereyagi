<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d2c4a"><title>Butter-Fly</title><style>html,body{margin:0;background:#fbf7ef;color:#0d2c4a;font-family:Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;font-weight:700;letter-spacing:.02em}</style></head><body><div class="boot">Butter-Fly yükleniyor…</div><script>(async()=>{try{const files=['v3parts/00.txt','v3parts/01.txt','v3parts/02.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' yüklenemedi');return r.text()}));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div style="padding:32px;font-family:Arial">Sayfa yüklenirken bir sorun oluştu. Lütfen yenileyin.</div>';console.error(e)}})();</script></body></html>
